# Example Lovelace card to add right after setup.
# Settings > Dashboards > (your dashboard) > Edit > Add Card > Manual (YAML)
# Replace entity id below with the one created by the integration
# (Settings > Devices & Services > Temperature Sensor > Entities).
type: statistics-graph
title: Temperature
entities:
  - sensor.temperature
days_to_show: 7
stat_types:
  - mean
  - min
  - max
