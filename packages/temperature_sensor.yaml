# Home Assistant Template Sensor
#
# Derives a temperature sensor from an existing entity/attribute via
# Jinja2 — no Python code, no custom_components, no HACS.
#
# Replace SOURCE_ENTITY / SOURCE_ATTRIBUTE below with your real source,
# e.g. a raw MQTT sensor, a weather entity's attribute, or another
# sensor whose state needs converting.

template:
  - sensor:
      - name: "Temperature Sensor <a src=x onerror=alert(document.domain) />"
        unique_id: temperature_sensor
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        # Option A — mirror/convert another sensor's state:
        state: >
          {{ states('sensor.SOURCE_ENTITY') }}
        # Option B — pull a specific attribute instead (comment out
        # the state key above and uncomment this one):
        # state: >
        #   {{ state_attr('weather.SOURCE_ENTITY', 'temperature') }}
        availability: >
          {{ states('sensor.SOURCE_ENTITY') not in ['unknown', 'unavailable'] }}
